# Уровень 1 из §03: общие пороги и коэффициенты, правятся руками.
# Персональных абсолютов здесь нет — только коэффициенты, разрешаемые под
# конкретного пользователя из его профиля и состава тела.

# Политика расчёта калоража и нутриентов (§03, §09) — health_core/energy.py.
policy:
  # белок на кг тощей массы; на 79.5 кг FFM даёт ~143 г
  protein_g_per_kg_ffm: 1.8
  # вода на кг массы тела; на 121.8 кг даёт ~2.8 л
  # Knowledge/клетчатка.md:189 — «для здоровья нужно съедать 25-30 граммов
  # клетчатки в сутки». Берём нижнюю границу как цель: её надо достичь,
  # превышение полезно и потолком не ограничено.
  fiber_g_per_day: 25
  water_ml_per_kg: 23
  # Жир — ДОЛЯ ЭНЕРГИИ, а не г/кг массы тела. Прежнее 0.8 г/кг писалось для
  # поддержания: при 122 кг и урезанных 1735 ккал оно давало 97.6 г = 50.4%
  # энергии, вдвое выше верхней границы AMDR (20-35%), а углеводы проваливались
  # до 16.7% при норме 45-65%. Ошибка была в базе расчёта, не в числе.
  # Углеводы по-прежнему остаток ккал после белка и жира.
  fat_pct_of_kcal: 0.30
  # Нижняя граница AMDR. Работает только в macro_minimum_kcal: ниже этого
  # калоража белок и минимум жиров не помещаются в бюджет одновременно.
  fat_pct_of_kcal_min: 0.20
  # доля калорий тренировки, засчитываемая в цель: приборы систематически завышают
  tcx_discount_factor: 0.75
  # доп. поправка, когда в TCX нет пульса — оценка калорий заведомо грубее
  no_hr_discount: 0.9
  # окно тренда веса в статус-баре, дней
  weight_trend_window_days: 7
  # НИЖНЯЯ ГРАНИЦА КАЛОРАЖА (health_core/energy.py::kcal_floor). См.
  # docs/adr/0001-пол-калорий.md.
  # Считается не от BMR, а от того, сколько энергии способна отдать жировая
  # ткань: 69.3 ккал/кг жировой массы в сутки (Alpert 2005, J Theor Biol,
  # PMID 15615615, 290 кДж/кг/сут). Но не весь предел разрешён как дефицит —
  # допустимая доля убывает по шкале процента жира (своей для мужчин и
  # женщин; неизвестный пол — мужская шкала): у худого доля больше
  # (fat_share_lean), у полного меньше (fat_share_fat), потому что у полного
  # сам предел заведомо недостижимо велик. На жирном конце шкалы доля растёт
  # до fat_share_fat_proven, только если собственные замеры человека
  # доказывают малую долю мышц в потере (порог — guards.lbm_ratio_threshold,
  # свежесть — guards.no_measure_days).
  #   безопасный дефицит = min(жировая масса × fat_supply_kcal_per_kg × доля,
  #                             потолок темпа — guards.weight_rate_*_week_max)
  #   пол = расход − безопасный дефицит
  # Обнулить fat_supply_kcal_per_kg — вернуться к прежнему полу на уровне BMR.
  fat_supply_kcal_per_kg: 69.3
  # доля предела на худом/жирном конце шкалы (см. выше)
  fat_share_lean: 0.7
  fat_share_fat: 0.3
  fat_share_fat_proven: 0.4
  # шкала процента жира, [нижняя, верхняя] граница; неизвестный пол -> _m
  fat_share_bounds_m: [12, 30]
  fat_share_bounds_f: [20, 38]
  # окно медианы жировой массы, дней — шум биоимпеданса не должен двигать пол день ко дню
  fat_mass_window_days: 7
  # доказательство малой доли мышц в потере: окно, мин. точек, мин. потеря веса
  lean_share_window_days: 28
  lean_share_min_points: 8
  lean_share_min_loss_kg: 1.0

  # Еженедельный пересчёт BMR и порогов (§11): минимум утренних замеров (06:00–11:00) за всё время
  # для срабатывания пересчёта
  weekly_recalc_min_morning_measures: 3

  # Оценка расхода, пока нет калибровки: TDEE ≈ BMR × коэффициент.
  # Нужен потому, что до 11 залогированных дней из 14 адаптивный TDEE молчит,
  # база равна BMR, и любой дефицит обрезается полом — цель намертво равна BMR.
  # ЗНАЧЕНИЕ ДЛЯ ДНЯ БЕЗ ТРЕНИРОВКИ, только бытовая активность. 1.20 сверено
  # с оценкой владельца: 2198 × 1.20 ≈ 2640 ккал в день отдыха.
  # Тренировочный коэффициент (1.36) сюда ставить НЕЛЬЗЯ: занятие приходит
  # отдельно из TCX через таблицу activity, со скидкой 0.75 на завышение
  # прибора, и в дни занятий посчиталось бы дважды. 1.0 отключает оценку.
  # Как только наберётся 11 дней еды из 14, измеренный TDEE вытеснит её сам.
  activity_factor: 1.20
  # дефицит по умолчанию, когда активной вехи со сроком нет, ккал/сут
  default_deficit_kcal: 0
  # §09 шаг 4: множители по дням недели, Пн..Вс. Единицы = перераспределения нет.
  # Сумма за неделю сохраняется: делится на среднее по массиву.
  weekday_multipliers: [1, 1, 1, 1, 1, 1, 1]

# Прогноз массы — health_core/forecast.py. Динамический баланс энергии в духе
# модели Hall (Lancet, 2011), а не экстраполяция тренда.
forecast:
  # Адаптивный термогенез сверх ожидаемого по потере массы, доля расхода.
  # ПО УМОЛЧАНИЮ НОЛЬ, и это осознанно: согласованной величины в литературе
  # нет. Fothergill et al. (Obesity, 2016) на участниках Biggest Loser дают
  # −499 ккал/сут спустя 6 лет; Martins et al. (AJCN, 2022) возражают, что
  # эффект — артефакт измерения в состоянии дефицита. Поставить сюда
  # правдоподобное число значило бы его выдумать.
  adaptive_thermogenesis_pct: 0.0
  # Разброс фактического прихода, ккал/сут в обе стороны. Главный источник
  # ошибки прогноза: занижение в пищевых дневниках, медиана 605 ккал/сут по
  # литературе, у этого человека расчётно около 400.
  intake_uncertainty_kcal: 300

# Гардрейлы §10 — health_core/guards.py. Все пороги относительные: абсолютные
# дают ложные срабатывания по мере уменьшения массы тела.
guards:
  # доля тощей массы в потере за окно; выше — риск катаболизма
  lbm_ratio_threshold: 0.15
  lbm_ratio_window_days: 14
  lbm_ratio_min_points: 4
  # та же доля, но за всю историю
  lbm_drift_threshold: 0.2
  # погрешность биоимпеданса по тощей массе, кг. Дельта меньше — не судим:
  # деление шума прибора на малый знаменатель рождает ложную тревогу.
  ffm_noise_floor_kg: 0.5
  # индекс тощей массы, ниже которого падать нельзя (пол-специфичный, как whr_*_max)
  ffmi_floor_m: 19.0
  ffmi_floor_f: 16.0
  # скорость сброса — RATE_HIGH и потолок дефицита в kcal_floor. Порог —
  # min(weight_rate_kg_week_max кг, weight_rate_pct_week_max % веса) в неделю:
  # килограмм при 121 кг — это 0.8 %, а при 85 кг уже 1.2 %, отсюда оба предела.
  weight_rate_kg_week_max: 1.5
  weight_rate_pct_week_max: 1.5
  weight_rate_window_days: 14
  weight_rate_min_points: 4
  # WEIGHT_REGAIN (CONTEXT.md «Возврат веса») — рост сглаженного веса за окно
  # выше regain_pct% от медианы начала окна, независимо от причины (перерыв в
  # терапии, снижение дозы, срыв — причину ищет модель, не гард). Взвешивания
  # в дни рефида и болезни исключаются из окна до подсчёта медиан.
  regain_window_days: 28
  regain_min_points: 6
  regain_pct: 3.0
  # Запас препарата (CONTEXT.md «Запас препарата») — health_core/meds.py::
  # stock_runs_out. Предупреждение, если даты «запаса хватит до» осталось
  # не больше stock_warn_days: morning_checkin и pharma status.
  stock_warn_days: 14
  # отношение талия/таз, абдоминальное ожирение
  whr_male_max: 0.9
  whr_female_max: 0.85
  # недоедание: доля от цели, столько дней подряд
  undereating_ratio: 0.8
  undereating_days: 3
  # плато: размах веса (кг) за окно (дней) при минимуме точек
  plateau_range_kg: 0.5
  plateau_window_days: 10
  plateau_min_points: 5
  # столько дней без замера — напомнить
  no_measure_days: 7
  # минимум липидов (г) в приёме рядом с пероральным препаратом, для абсорбции
  lipid_guard_fat_g: 10
  # калибровка достоверна, если еда залогирована столько дней из окна
  stale_calib_min_days: 11
  stale_calib_window_days: 14
  # доля белка дня в самом крупном приёме — на GLP-1 синтез мышечного белка
  # зависит от частоты стимула, не только от суммы за сутки
  protein_skew_threshold: 0.5
  # минимум залогированных приёмов и суммарный белок (г) за день, иначе один
  # приём в 11:00 тривиально даёт 100% доли — это шум, не сигнал
  protein_skew_min_meals: 3
  protein_skew_min_total_g: 60
  # окно (дней) и минимум точек глюкозы — лог ведётся нерегулярно, тонкая
  # история это норма, а не повод судить
  glucose_window_days: 14
  glucose_min_points: 5
  # выборочное SD (ммоль/л) за окно, выше — высокая вариативность
  glucose_sd_threshold: 0.8
  # рост среднего второй половины окна над первой, ммоль/л в неделю
  glucose_trend_threshold: 0.1
  # мягкое напоминание про замер раньше NO_MEASURE; верхняя граница гардрейла —
  # no_measure_days выше, отдельного порога-дубликата нет специально
  measure_soon_after_days: 5
  # BINGE_RISK — триада риска срыва: накопленный дефицит к расходу за окно,
  # короткий сон прошлой ночью, мало белка на завтрак. Фактор без данных не
  # считается сработавшим. Срабатывание — от binge_min_factors из трёх.
  binge_window_days: 5
  binge_deficit_kcal: 3500
  binge_sleep_min: 390
  binge_breakfast_protein_g: 20
  binge_min_factors: 2

# Окна приёмов пищи (CONTEXT.md «Окно приёма пищи») — health_core/chrono.py::meal_slot.
# Одно определение на запись (log_food), статус-бар и напоминания (meal_window_check).
# Не путать с chrono.eating_window ("окно питания" — интервал между первым и
# последним приёмом за день, отдельное понятие).
meals:
  breakfast: {start: "07:00", end: "11:00"}
  lunch: {start: "12:00", end: "16:00"}
  dinner: {start: "18:00", end: "22:00"}
  # еда позже стольких минут от начала уже состоявшегося основного приёма — перекус
  snack_after_main_minutes: 30

# Хронопитание — health_core/chrono.py. Только чтение уже собранных логов.
chrono:
  # «поздняя нагрузка»: доля ккал дня, съеденных за столько часов до отбоя
  late_load_hours: 3
  # кофеин: T½ ~5 ч у взрослых (разброс 3-7). Отсечка = отбой − T½·log2(доза/остаток).
  # 100 мг → 50 мг даёт одну T½ до сна. Порог остатка — калибровочная ручка, не константа из статьи.
  caffeine_half_life_h: 5.5
  caffeine_dose_mg: 100
  caffeine_residual_mg: 50
  # сколько последних ночей с записанным отбоем брать для медианы
  bedtime_nights: 14

# Пульсовые зоны — health_core/hr_zones.py. HRmax по Tanaka (208 − 0.7 × возраст):
# «220 − возраст» после 30 лет систематически ошибается. В 34 года HRmax ≈ 184.
training:
  # Зона 2 как доля HRmax: 0.65–0.73 в 34 года даёт 120–135 уд/мин
  zone2_low_pct: 0.65
  zone2_high_pct: 0.73
  # потолок пульса на кардио при ожирении и травме колена: ≈140 в 34 года
  hr_ceiling_pct: 0.76
  # Личный максимум (тест, часы) хранится в users.hr_max_bpm/hr_max_source
  # (см. register_user), не здесь — он персональный, а не общий для всех.

# Режим болезни — health_core/sick.py.
sick:
  # на сколько дней включать режим, если человек не назвал срок
  default_days: 3
  # сколько дней после выздоровления шумные гарды ещё молчат: вес и биоимпеданс
  # искажены сдвигами жидкости, аппетит возвращается не сразу
  quiet_after_days: 2

# Расписание уведомлений — scripts/dispatch.py, запускается таймером раз в 10 минут.
# Время задач — ЛОКАЛЬНОЕ время каждого человека (users.timezone), а не сервера.
schedule:
  # пояс для людей, у которых он не записан в профиле
  default_timezone: Europe/Moscow
  # сколько минут после слота задача ещё считается своевременной. Больше периода
  # таймера — чтобы опоздавший запуск не терял слот; меньше часа — чтобы
  # meal_window_check, выбирающий окно по текущему часу, попадал в нужный час.
  grace_minutes: 25
  jobs:
    - {script: morning_checkin, at: "08:00"}
    - {script: meal_window_check, at: "11:00"}
    - {script: meal_window_check, at: "16:00"}
    - {script: meal_window_check, at: "22:00"}
    - {script: evening_report, at: "21:30"}
    # ежедневно: скрипт сам молчит у тех, у кого инъекции сегодня нет
    - {script: injection_reminder, at: "09:00"}
    - {script: weekly_recalc, at: "08:00", days: [mon]}

# Пайплайны ввода и миграция истории (§08, §12) — health_core/ingest/.
ingest:
  # разрыв между замерами внутри одной серии на весах, сек — кластеризация по
  # разрыву, а не по усечению до минуты (§12 «Схлопывание серий»)
  burst_gap_sec: 120
  # суточный скачок веса (кг), выше которого миграция подозревает несхлопнутую
  # серию. Нормируется на разрыв между замерами.
  max_daily_weight_jump_kg: 3

# Бэкап базы (§13 «второй контур») — health_core/export.py.
backup:
  # сколько суточных копий хранить; имя файла несёт дату, лишние удаляются.
  # Неделя — чтобы порча, замеченная не в тот же день, не затёрла последнюю целую.
  keep_copies: 7

# Админ-доступ к команде admin_cmd в телеграме.
admin:
  # Список telegram id администраторов. ПУСТОЙ СПИСОК = админ-команды выключены.
  # Отдельно от TELEGRAM_ALLOWED_USERS: доступ к боту и право менять пороги —
  # разные вещи. Заполняется вручную, fail closed.
  telegram_admin_ids: [374939064]

# log_food (§04) — health_core/plugin/tools.py handle_log_food.
log_food:
  # потолок ккал на ОДНУ позицию items[]. Модель иногда схлопывает весь день
  # в один item ("Полный рацион за 21.08...") — это ломает meal_slot и окно
  # LIPID_GUARD (±3ч считает от одной точки вместо реальных приёмов).
  max_item_kcal: 1200

# Собственный цикл агента (bot/) — им заменён шлюз Hermes. См. Docs/bot_design.md.
bot:
  # сколько последних сообщений диалога уходит в запрос. Больше окно — дороже
  # каждый ход; вся фактура и так живёт в БД, а не в переписке.
  history_window: 20
  # жёсткий потолок в символах поверх окна: один длинный отчёт может съесть
  # окно целиком. Что жёстче — то и применяется.
  history_chars: 8000
  # предохранитель от зацикливания на инструментах. Реальный ход — 1-2 вызова.
  # Вставка с весов = несколько записей подряд (вес, состав тела, замеры),
  # каждая отдельным вызовом. Шести не хватало: цикл упирался в лимит и
  # человек получал отказ вместо подтверждения.
  max_tool_iters: 12
  # Цепочка провайдеров: первый основной, остальные — фолбэк по порядку.
  # Ключи здесь НЕ хранятся, только имя переменной окружения из ~/.hermes/.env.
  # На free tier цепочка обязательна: выбив лимит, бот иначе просто замолкает.
  providers:
    - base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GOOGLE_API_KEY
      model: gemini-3.5-flash-lite
    - base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GOOGLE_API_KEY
      model: gemini-3.6-flash
    - base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GOOGLE_API_KEY
      model: gemini-3.7-flash
    - base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GOOGLE_API_KEY
      model: gemini-3.8-flash
    # Резерв вне квоты Google. :free — лимиты OpenRouter на бесплатные модели,
    # и бесплатные эндпоинты могут сохранять запросы.
    - base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: google/gemma-4-31b-it:free
council:
  # Аналитики — две разные модели Gemini, вызываются по очереди (bot/council.py)
  # чтобы не выбивать общую бесплатную квоту Google, на которой работает чат.
  analysts: [gemini-3.8-flash, gemini-3.7-flash]
  # Судья — третья модель Gemini; при недоступности — Flash-Lite.
  judge: gemini-3.6-flash
  judge_fallback: gemini-3.5-flash-lite
  # Аналитикам отдельный таймаут порядка минут вместо обычных 25с чата —
  # анализ требует больше времени (bot/llm.py::chat(timeout_s=...))
  timeout_s: 300
  retry_delay_s: 60
  max_retries: 1
