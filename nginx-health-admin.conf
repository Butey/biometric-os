# Панель администратора: только TLS на 8443 (443 на этом сервере занят). Порт 80 - редирект.
# Сертификат общий с vm226917.dl-vps.com, продлевает certbot.timer.
# Вместе с этим файлом в ~/.hermes/.env нужен ADMIN_BEHIND_TLS=1 (cookie Secure, учёт IP клиента).
server {
    listen 80;
    listen [::]:80;
    server_name tghags.duckdns.org;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name tghags.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/vm226917.dl-vps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vm226917.dl-vps.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ровно один адрес: панель берёт IP клиента из этого заголовка для лимита попыток входа.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
